<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rain by Ear</title>
<style>
  body { font-family: sans-serif; text-align: center; padding: 16px; background: #f4f4f4; }
  #status { font-size: 26px; font-weight: bold; padding: 28px 10px; margin: 16px 0;
            border-radius: 12px; color: white; background: gray; }
  button, select { font-size: 18px; padding: 10px 16px; margin: 6px; border-radius: 8px; }
  #numbers { font-size: 15px; color: #333; }
  #log { text-align: left; font-size: 14px; max-width: 420px; margin: 16px auto; }
</style>
</head>
<body>

<h1>Rain by Ear</h1>
<select id="phone">
  <option value="camon">Tecno Camon 20</option>
  <option value="a52">Samsung Galaxy A52</option>
</select>
<br>
<button id="startBtn">Start listening</button>
<button id="calBtn">Calibrate (quiet)</button>
<div id="status">Choose your phone, then press Start</div>
<div id="numbers"></div>
<div id="log"></div>

<script>
// ----- dividing lines learned from our recordings (sessions 3 and 4) -----
const PHONES = {
  camon: { score: 0.87, quiet: -49.6, light: -40.1, moderate: -25.2, heavy: -16.9 },
  a52:   { score: 0.27, quiet: -42.3, light: -37.7, moderate: -28.2, heavy: -20.5 }
};
const WINDOW = 300;        // judge the last 30 seconds (300 pieces of 0.1 s)
const ALERT_MINUTES = 3;   // flood warning when heavy rain lasts this long

// ----- what each level shows on screen -----
const levels = {
  none:     { text: "OK - no rain",                    color: "#2e7d32" },
  light:    { text: "Light rain - no action needed",   color: "#1976d2" },
  moderate: { text: "Moderate rain - keep watching",   color: "#ef6c00" },
  heavy:    { text: "Heavy rain - watch for flooding", color: "#c62828" },
  alert:    { text: "FLOOD WARNING: heavy rain for " + ALERT_MINUTES + " minutes",
              color: "#7f0000" }
};

let ctx, analyser, timeData, freqData;
let pieces = [];           // one entry per 0.1 s
let offset = 0;            // calibration shift for the loudness lines
let calibrating = false;
let calPieces = [];
let heavySince = null;
let alerted = false;
let lastLevel = null;

const phoneBox = document.getElementById("phone");
const statusBox = document.getElementById("status");
const numbersBox = document.getElementById("numbers");
const logBox = document.getElementById("log");

// measure one 0.1 s piece: loudness, hiss and low-pitch sound
function measure() {
  analyser.getFloatTimeDomainData(timeData);
  let sum = 0;
  for (const v of timeData) sum += v * v;
  const db = 10 * Math.log10(sum / timeData.length + 1e-12);

  analyser.getFloatFrequencyData(freqData);   // strength of each pitch, in dB
  const binHz = ctx.sampleRate / analyser.fftSize;
  let logSum = 0, total = 0, low = 0, count = 0;
  for (let i = 0; i < freqData.length; i++) {
    const hz = i * binHz;
    if (hz < 100 || hz > 8000) continue;
    const p = Math.pow(10, freqData[i] / 10) + 1e-20;
    logSum += Math.log(p);
    total += p;
    count++;
    if (hz < 500) low += p;
  }
  const hiss = Math.exp(logSum / count) / (total / count);
  return { db: db, hiss: hiss, low: low, total: total };
}

// combine many pieces: loudness, rain score (hiss / low share)
function summary(list) {
  let power = 0, hiss = 0, low = 0, total = 0;
  for (const p of list) {
    power += Math.pow(10, p.db / 10);
    hiss += p.hiss;
    low += p.low;
    total += p.total;
  }
  const loud = 10 * Math.log10(power / list.length);
  const lowShare = low / total + 1e-9;
  const score = (hiss / list.length) / lowShare;
  return { loud: loud, score: score, lowShare: lowShare };
}

// the rule: rain score first, then loudness
function classify(s) {
  const L = PHONES[phoneBox.value];
  if (s.score < L.score) return "none";
  if (s.loud >= L.heavy + offset) return "heavy";
  if (s.loud >= L.moderate + offset) return "moderate";
  if (s.loud >= L.light + offset) return "light";
  return "none";
}

// sound and vibration for the flood warning
function alertUser() {
  if (navigator.vibrate) navigator.vibrate([500, 200, 500, 200, 500]);
  const osc = ctx.createOscillator();
  osc.frequency.value = 880;
  osc.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 1.5);
}

function addLog(text) {
  const time = new Date().toLocaleTimeString();
  logBox.innerHTML = time + "  " + text + "<br>" + logBox.innerHTML;
}

// runs every 0.1 seconds
function tick() {
  const m = measure();

  // calibration: 5 seconds of quiet sets the loudness shift
  if (calibrating) {
    calPieces.push(m);
    statusBox.textContent = "Calibrating... stay quiet";
    if (calPieces.length >= 50) {
      const quiet = summary(calPieces).loud;
      offset = quiet - PHONES[phoneBox.value].quiet;
      calibrating = false;
      pieces = [];
      addLog("Calibrated (shift " + offset.toFixed(1) + " dB)");
      statusBox.textContent = "Calibrated - listening";
    }
    return;
  }

  pieces.push(m);
  if (pieces.length > WINDOW) pieces.shift();
  if (pieces.length < 100) {          // wait for 10 seconds of sound
    statusBox.textContent = "Listening...";
    return;
  }

  const s = summary(pieces);
  let key = classify(s);

  // track how long heavy rain has lasted
  if (key === "heavy") {
    if (heavySince === null) heavySince = Date.now();
    const minutes = (Date.now() - heavySince) / 60000;
    if (minutes >= ALERT_MINUTES) {
      if (!alerted) {
        alertUser();
        alerted = true;
      }
      key = "alert";
    }
  } else {
    heavySince = null;
    alerted = false;
  }

  if (key !== lastLevel) {
    addLog(levels[key].text);
    lastLevel = key;
  }
  statusBox.textContent = levels[key].text;
  statusBox.style.background = levels[key].color;
  numbersBox.textContent = "Loudness " + s.loud.toFixed(1) + " dB  |  Rain score " +
    s.score.toFixed(2) + "  |  Shift " + offset.toFixed(1) + " dB";
}

// start: ask for the microphone and begin listening
document.getElementById("startBtn").onclick = async () => {
  if (analyser) return;               // already listening
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    ctx = new AudioContext();
    analyser = ctx.createAnalyser();
    analyser.fftSize = 4096;
    analyser.smoothingTimeConstant = 0;
    ctx.createMediaStreamSource(stream).connect(analyser);
    timeData = new Float32Array(analyser.fftSize);
    freqData = new Float32Array(analyser.frequencyBinCount);
    setInterval(tick, 100);
    statusBox.textContent = "Listening...";
    addLog("Started on " + phoneBox.options[phoneBox.selectedIndex].text);
    try { await navigator.wakeLock.request("screen"); } catch (e) {}
  } catch (err) {
    statusBox.textContent = "Microphone not allowed: " + err.message;
  }
};

// calibrate: learn what quiet sounds like on this phone
document.getElementById("calBtn").onclick = () => {
  if (!analyser) { alert("Press Start listening first"); return; }
  calibrating = true;
  calPieces = [];
};

// a new phone needs a new calibration
phoneBox.onchange = () => {
  offset = 0;
  pieces = [];
  addLog("Phone changed - please calibrate");
};
</script>

</body>
</html>
